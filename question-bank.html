<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank | Ashoka Quiz Portal</title><link rel="stylesheet" href="style.css"></head>
<body><div class="portal-page"><header class="topbar"><a class="brand" href="faculty-dashboard.html"><span class="brand-mark">AQ</span><span><b>Ashoka Quiz Portal</b><small>Ashoka Women’s Engineering College (Autonomous)</small></span></a><nav><a href="faculty-dashboard.html">Dashboard</a><a href="create-quiz.html">Create Quiz</a><a class="active" href="question-bank.html">Question Bank</a><a href="faculty-dashboard.html#reports">Reports</a></nav><button class="outline" onclick="location.href='faculty-dashboard.html'">← Dashboard</button></header>
<main class="dashboard"><section class="page-title"><div><p class="eyebrow">FACULTY • QUESTION BANK</p><h1>Question Bank</h1><p>Store, search, edit and reuse your MCQ questions.</p></div><button class="primary" onclick="location.href='create-quiz.html'">＋ Create Quiz</button></section>
<section class="dash-card"><div class="bank-toolbar"><input id="search" placeholder="Search questions..." oninput="render()"><select id="filter" onchange="render()"><option value="">All Subjects</option><option>Python Programming</option><option>Data Structures</option><option>Artificial Intelligence</option><option>Engineering Mathematics</option></select><button class="ghost" onclick="seed()">＋ Add Demo Questions</button></div><div id="bank"></div></section></main></div>
<script>
if(!localStorage.getItem('aqpFacultyLoggedIn')) location.href='faculty.html';
const key='aqpQuestionBank';
function get(){return JSON.parse(localStorage.getItem(key)||'[]')}
function save(x){localStorage.setItem(key,JSON.stringify(x))}
function seed(){const x=get();[['What does Python use to define a block?','Indentation','Python Programming'],['Which structure follows LIFO?','Stack','Data Structures'],['Which technique reduces overfitting by randomly dropping units?','Dropout','Artificial Intelligence'],['What is the derivative of x²?','2x','Engineering Mathematics']].forEach((q,i)=>x.push({id:Date.now()+i,text:q[0],answer:q[1],subject:q[2],marks:1}));save(x);render()}
function render(){const q=get(),term=document.getElementById('search').value.toLowerCase(),sub=document.getElementById('filter').value,box=document.getElementById('bank');const rows=q.filter(x=>(!term||x.text.toLowerCase().includes(term))&&(!sub||x.subject===sub));box.innerHTML=rows.length?rows.map(x=>`<article class="bank-item"><div><span class="bank-subject">${x.subject}</span><h3>${x.text}</h3><p>Correct answer: <b>${x.answer}</b> • ${x.marks} mark</p></div><button class="remove-q" onclick="del('${x.id}')">Delete</button></article>`).join(''):'<div class="empty-bank">No questions yet. Add questions from the Quiz Creator or use Demo Questions for testing.</div>'}
function del(id){save(get().filter(x=>String(x.id)!==String(id)));render()} render();
</script></body></html>
