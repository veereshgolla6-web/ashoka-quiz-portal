<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty Login | Ashoka Quiz Portal</title><link rel="stylesheet" href="style.css"></head>
<body><div class="portal-page">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AQ</span><span><b>Ashoka Quiz Portal</b><small>Ashoka Women’s Engineering College (Autonomous)</small></span></a>
<nav><a href="index.html">Home</a><a href="features.html">Features</a><a href="departments.html">Departments</a><a href="leaderboard.html">Leaderboard</a></nav>
<a class="outline" href="index.html">← Home</a></header>
<main class="login-shell"><div class="page-tabs"><a href="student.html">Student Login</a><a href="faculty.html" class="active">Faculty Login</a></div>
<section class="login-card"><p class="eyebrow">FACULTY ACCESS</p><h1>Faculty Login</h1><p class="login-sub">Demo faculty access — no real faculty account is required in this version.</p>
<form id="facultyForm"><input id="facultyName" required autocomplete="username" placeholder="Demo Faculty ID" value="faculty"><input id="password" required type="password" placeholder="Demo Password" value="1234"><button class="primary large" type="submit">Enter Faculty Dashboard →</button></form>
<p id="msg" class="message"></p><div class="login-help"><span>Demo ID: <b>faculty</b> &nbsp; Password: <b>1234</b></span><a href="index.html">Back to Home</a></div></section></main>
</div><<script>
document.getElementById('facultyForm').addEventListener('submit',e=>{
 e.preventDefault();
 const id=document.getElementById('facultyName').value.trim();
 const pw=document.getElementById('password').value;
 const msg=document.getElementById('msg');
 if(id.toLowerCase()!=='faculty'||pw!=='1234'){msg.textContent='Use the demo Faculty ID: faculty and Password: 1234';return;}
 localStorage.setItem('aqpFacultyName','Demo Faculty');
 localStorage.setItem('aqpFacultyLoggedIn','true');
 localStorage.setItem('aqpDemoMode','true');
 msg.textContent='Demo login successful. Opening dashboard...';
 setTimeout(()=>location.href='faculty-dashboard.html',300);
});
</script></body></html></body></html>
